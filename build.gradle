buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.0'
    }
}

apply plugin: 'com.android.application'

android {
    compileSdk = 36
    namespace = "com.irondonkey.dictation"

    defaultConfig {
        applicationId = "com.irondonkey.dictation"
        minSdk = 24
        targetSdk = 36
        versionCode = 2
        versionName = "1.1"
    }

    // One APK per chip type, so each stays under 10 MB.
    splits {
        abi {
            enable = true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk = false
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            // Store the native library compressed so the APK stays under 10 MB.
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/**', 'kotlin/**', '**/*.kotlin_builtins', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}
