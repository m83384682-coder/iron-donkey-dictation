buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.0'
    }
}

apply plugin: 'com.android.application'

android {
    compileSdk = 36
    namespace = "com.irondonkey.dictation"

    defaultConfig {
        applicationId = "com.irondonkey.dictation"
        minSdk = 24
        targetSdk = 36
        versionCode = 4
        versionName = "1.3"
    }

    // One APK per chip type, plus a universal APK that works on every phone.
    splits {
        abi {
            enable = true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            // Store the native library compressed so the download stays small.
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/**', 'kotlin/**', '**/*.kotlin_builtins', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    // Offline translation (models downloaded in the app) and language detection, by Google ML Kit.
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
